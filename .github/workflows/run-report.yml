name: Générateur de Rapport Dynamique

on:
  workflow_dispatch:
    inputs:
      project_idea:
        description: 'Nom ou idée du projet (ex: Boitier Raspberry, Engrenage, etc.)'
        required: true
        default: 'Boitier de protection électronique'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Lancer le script dynamique
      env:
        PROJECT_IDEA: ${{ github.event.inputs.project_idea }}
      run: |
        python generate_report.py "$PROJECT_IDEA"

    - name: Commit et Push des modifications
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add report.html
        git diff --staged --quiet || git commit -m "🤖 Mise à jour dashboard : ${{ github.event.inputs.project_idea }}"
        git push
